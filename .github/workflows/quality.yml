name: Tests, quality and secrets
on:
  pull_request:
  push:
    branches: [fix/trading-bot-deepseek]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    env:
      AI_MODE: 'OFF'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch verified frozen research datasets
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/research-data-btcusdt-v1"
          mkdir -p "$data_dir"
          base_url="https://github.com/kazaxvslezax1/PythonProject3/releases/download/research-data-btcusdt-v1"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$data_dir/BTCUSDT_1h_2024-01-01_2026-01-01.csv" \
            "$base_url/BTCUSDT_1h_2024-01-01_2026-01-01.csv"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$data_dir/BTCUSDT_1h.csv.gz" \
            "$base_url/BTCUSDT_1h.csv.gz"
          test "$(wc -c < "$data_dir/BTCUSDT_1h_2024-01-01_2026-01-01.csv")" -eq 1862001
          test "$(wc -c < "$data_dir/BTCUSDT_1h.csv.gz")" -eq 2140399
          printf '%s  %s\n' \
            3d30bd2b046d9c1ae8af77259b95d55341a5667d566a90a0a47ba6d238d50f03 \
            "$data_dir/BTCUSDT_1h_2024-01-01_2026-01-01.csv" \
            f83997fa6ea0aaa38b0050589b3c95ddebb999a09abe5cf9f880482b5f803c16 \
            "$data_dir/BTCUSDT_1h.csv.gz" | sha256sum --check
          install -D -m 0644 "$data_dir/BTCUSDT_1h_2024-01-01_2026-01-01.csv" \
            runtime/walk_forward/data/BTCUSDT_1h_2024-01-01_2026-01-01.csv
          install -D -m 0644 "$data_dir/BTCUSDT_1h.csv.gz" \
            reports/FUTURES_FLOW_OI_DATA/normalized/futures_aggregate/BTCUSDT_1h.csv.gz
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python scripts/check_secrets.py
      - run: git diff --check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
